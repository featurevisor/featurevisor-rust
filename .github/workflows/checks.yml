name: Checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: SDK (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.74.0", stable]

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Build
        run: cargo build --all-features
      - name: Test
        run: cargo test --all-features
      - name: Format and lint
        if: matrix.rust == 'stable'
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-features --all-targets -- -D warnings

  example:
    name: Featurevisor example 1
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set up Featurevisor example-1 project
        run: |
          mkdir example-1
          cd example-1
          npx --yes @featurevisor/cli@3 init --example=1
          npm install
          npx featurevisor build
          npx featurevisor test --onlyFailures
      - name: Run example project through Rust SDK
        run: cargo run --features cli --bin featurevisor -- test --projectDirectoryPath=./example-1 --onlyFailures
