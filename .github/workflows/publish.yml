name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: featurevisor/featurevisor
          ref: main
          path: featurevisor
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version-file: featurevisor/.nvmrc
          cache: npm
          cache-dependency-path: featurevisor/package-lock.json
      - name: Build Featurevisor CLI
        working-directory: featurevisor
        run: |
          npm ci
          npm run build
      - name: Verify tag matches crate version
        shell: bash
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "${GITHUB_REF_NAME#v}" = "$crate_version"
      - name: Check
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-features --all-targets -- -D warnings
          cargo test --all-features
      - name: Run example project through Rust SDK
        run: cargo run --features cli --bin featurevisor -- test --projectDirectoryPath=featurevisor/examples/example-1 --onlyFailures
      - name: Remove integration checkout
        run: rm -rf featurevisor
      - name: Verify package contents
        run: |
          cargo package --all-features
          cargo package --list --all-features
      - name: Publish
        run: cargo publish --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
